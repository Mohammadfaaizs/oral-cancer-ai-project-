services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      PORT: 6000
      MODEL_DIR: /app/models
    ports:
      - "6000:6000"
    volumes:
      - ./ai-service/models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/oral_cancer_ai
      JWT_SECRET: change-this-in-production-to-a-long-random-value
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:4173
      AI_SERVICE_URL: http://ai-service:6000
      AI_TIMEOUT_MS: 60000
      UPLOAD_DIR: uploads
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_AI_URL: http://localhost:6000
    ports:
      - "4173:4173"

volumes:
  mongo_data:
